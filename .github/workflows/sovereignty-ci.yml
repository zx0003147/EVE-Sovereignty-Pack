name: Sovereignty CI Foundation

# Keep this cross-repository package build manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  FEATURE_API_MAVEN_REPOSITORY_URL: ${{ vars.FEATURE_API_MAVEN_REPOSITORY_URL }}

jobs:
  standalone-coordinate-build:
    name: Standalone coordinate build on Windows / JDK 25
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Sovereignty sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify Feature API package access configuration
        shell: pwsh
        env:
          FEATURE_API_PACKAGES_TOKEN: ${{ secrets.FEATURE_API_PACKAGES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEATURE_API_MAVEN_REPOSITORY_URL)) {
            throw "Configure repository variable FEATURE_API_MAVEN_REPOSITORY_URL before running Sovereignty CI."
          }
          if ([string]::IsNullOrWhiteSpace($env:FEATURE_API_PACKAGES_TOKEN)) {
            throw "Configure repository secret FEATURE_API_PACKAGES_TOKEN before running Sovereignty CI."
          }

      - name: Clean and test against Feature API coordinates
        shell: pwsh
        run: >-
          .\gradlew.bat --no-daemon --console=plain
          -PfeatureApiGitHubPackagesRepository="$env:FEATURE_API_MAVEN_REPOSITORY_URL"
          clean test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.FEATURE_API_PACKAGES_TOKEN }}

      - name: Check standalone boundaries
        shell: pwsh
        run: >-
          .\gradlew.bat --no-daemon --console=plain
          -PfeatureApiGitHubPackagesRepository="$env:FEATURE_API_MAVEN_REPOSITORY_URL"
          check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.FEATURE_API_PACKAGES_TOKEN }}

      - name: Package canonical external Feature Pack
        shell: pwsh
        run: >-
          .\gradlew.bat --no-daemon --console=plain
          -PfeatureApiGitHubPackagesRepository="$env:FEATURE_API_MAVEN_REPOSITORY_URL"
          packageExternalFeaturePack
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.FEATURE_API_PACKAGES_TOKEN }}
